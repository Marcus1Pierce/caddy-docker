name: Docker Build
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/docker.yml'
      - '2.11/alpine-plugins/**'
      - 'stackbrew-config.yaml'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Caddy version from stackbrew-config.yaml
        id: version
        # yq is preinstalled on ubuntu-latest runners
        run: |
          echo "caddy_version=v$(yq -r '.versions[0].caddy_version' stackbrew-config.yaml)" >> "$GITHUB_OUTPUT"
          echo "dist_commit=$(yq -r '.versions[0].dist_commit' stackbrew-config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: 2.11/alpine-plugins
          platforms: linux/amd64,linux/arm64
          push: true
          tags: marcus1pierce/caddy:2
          build-args: |
            CADDY_VERSION=${{ steps.version.outputs.caddy_version }}
            DIST_COMMIT=${{ steps.version.outputs.dist_commit }}
          cache-from: type=registry,ref=marcus1pierce/caddy:2-buildcache
          cache-to: type=registry,ref=marcus1pierce/caddy:2-buildcache,mode=max
